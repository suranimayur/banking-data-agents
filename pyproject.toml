[project]
name = "banking-data-agents"
version = "0.1.0"
description = "Productionized agentic AI over governed banking data products, on Amazon Bedrock AgentCore + Strands, testable offline against Floci"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "boto3>=1.35",
    "botocore>=1.35",
    "polars>=1.13",
    "pyarrow>=17.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "duckdb>=1.1",
    "sqlglot>=25.0",
    "structlog>=24.4",
    "tenacity>=9.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "streamlit>=1.40",
    "strands-agents>=1.57",
    "rich>=13.9",
]

[project.scripts]
bda = "banking_data_agents.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "moto>=5.0",
    # moto's Glue backend parses SQL with pyparsing; without it `mock_aws` for
    # Glue raises ModuleNotFoundError at call time, not at import time.
    "pyparsing>=3.1",
    "ruff>=0.7",
    "mypy>=1.12",
    "types-pyyaml>=6.0",
]
infra = [
    "aws-cdk-lib>=2.160",
    "constructs>=10.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/banking_data_agents"]

[tool.ruff]
line-length = 120
target-version = "py312"
# `infra` is included so the deployment code is held to the same lint rules as the
# application. It is excluded from the wheel, not from review.
src = ["src", "tests", "infra"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
# aws-cdk-lib lives in the optional `infra` dependency group, so a type check with
# only the dev group installed must not fail on a missing CDK stub.
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
files = ["src/banking_data_agents", "infra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a running Floci emulator or real AWS",
    "smoke: post-deploy assertions run by the pipeline",
    "slow: takes more than a few seconds",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/banking_data_agents"]
omit = ["src/banking_data_agents/ui/*"]
